<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>

<style>
:root {
    --primary-dark: #0a192f;
    --primary-light: #f5f7fb;
    --accent: #64ffda;
    --text-dark: #8892b0;
    --text-light: #1f2933;
    --white: #e6f1ff;
    --card-bg-dark: rgba(17,34,64,0.85);
    --card-bg-light: rgba(255,255,255,0.85);
    --danger: #ff4d4d;
}

/* DARK MODE */
html[data-theme="dark"] body {
    background: radial-gradient(circle at top, #112240 0, #020c1b 40%, #000 100%);
    color: var(--text-dark);
}

/* LIGHT MODE FIX — TEXT NOW VISIBLE */
html[data-theme="light"] body {
    background: var(--primary-light);
    color: var(--text-light);
}

html[data-theme="light"] .question-text,
html[data-theme="light"] .answer-content,
html[data-theme="light"] .meta-info span,
html[data-theme="light"] .difficulty-badge {
    color: #1f2933 !important;
}

html[data-theme="light"] .card {
    background: rgba(255,255,255,0.9) !important;
    border-color: #d1d5db !important;
}

html[data-theme="light"] .tag-btn {
    background: #ffffff !important;
    color: #1f2933 !important;
    border-color: #d1d5db !important;
}

html[data-theme="light"] .action-btn {
    background: #ffffff !important;
    color: #1f2933 !important;
    border-color: #d1d5db !important;
}

/* GENERAL UI */
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    padding: 0;
    padding-bottom: 80px;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #020c1b, #112240);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 2px solid rgba(255,255,255,0.05);
    position: relative;
}

header h1 {
    margin: 0;
    font-size: 28px;
    color: var(--white);
    font-weight: 700;
}

.subtitle {
    font-size: 13px;
    color: var(--accent);
    margin-top: 5px;
    font-weight: 600;
    text-transform: uppercase;
}

/* THEME TOGGLE */
.theme-toggle {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--accent);
    font-size: 12px;
}
.theme-toggle button {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--accent);
    cursor: pointer;
    font-size: 11px;
}

/* LAYOUT */
.main-layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media(min-width: 900px) {
    .main-layout {
        grid-template-columns: 320px 1fr;
    }
    .sidebar-controls {
        position: sticky;
        top: 20px;
        height: max-content;
    }
}

/* CONTROL PANEL */
.control-panel {
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    margin-bottom: 20px;
}

.control-panel h3 {
    color: var(--white);
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 16px;
}

/* INPUTS */
.directory-box {
    margin-bottom: 15px;
}
.directory-box label {
    display: block;
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}
.directory-select {
    width: 100%;
    padding: 12px 15px;
    background: rgba(2,12,27,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--white);
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

.search-box input {
    width: 100%;
    padding: 14px 20px;
    background: rgba(2,12,27,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--white);
    font-size: 15px;
}

/* CARDS */
.card {
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    position: relative;
}

.question-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 18px;
}

/* TAG BUTTONS */
.tag-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.tag-btn {
    border-radius: 999px;
    border: 1px solid #233554;
    background: #0a192f;
    color: #64ffda;
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 600;
}

.tag-btn.active-bookmark {
    background: #64ffda;
    color: #0a192f;
    border-color: #64ffda;
}

.tag-btn.active-weak {
    background: #ff4d4d;
    color: white;
}

.tag-btn.active-strong {
    background: #4caf50;
    color: white;
}

/* ANSWER BOX */
.answer-box {
    display: none;
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
}

.answer-box.show {
    display: block;
}

.answer-title {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 12px;
}

.answer-content {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--white);
}

/* BUTTONS */
.action-btn {
    background: #112240;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
}

</style>
</head>

<body>

<header>
    <h1>AstroMate Orals</h1>
    <div class="subtitle">Premium Chief Mate Prep Dashboard</div>

    <div class="theme-toggle">
        <span>Theme</span>
        <button onclick="setTheme('dark')">Dark</button>
        <button onclick="setTheme('light')">Light</button>
    </div>
</header>

<div class="main-layout">

    <div class="sidebar-controls">
        <div class="control-panel">

                <label>Filter by Surveyor</label>
                <select id="surveyorSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="all">All Surveyors</option>
                </select>
            </div>

            <!-- FUNCTION (ONLY F1 / F2 / F3) -->
            <div class="directory-box">
                <label>Filter by
