<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>

<style>
:root {
    --primary: #0a192f;
    --accent: #64ffda;
    --text: #8892b0;
    --white: #e6f1ff;
    --card-bg: #112240;
    --dark-blue: #020c1b;
    --danger: #ff4d4d;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--primary);
    margin: 0;
    padding: 0;
    color: var(--text);
    padding-bottom: 80px;
}

header {
    background: var(--dark-blue);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 2px solid var(--card-bg);
}

header h1 {
    margin: 0;
    font-size: 28px;
    color: var(--white);
    font-weight: 700;
}

.subtitle {
    font-size: 13px;
    color: var(--accent);
    margin-top: 5px;
    font-weight: 600;
    text-transform: uppercase;
}

.main-layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media(min-width: 900px) {
    .main-layout {
        grid-template-columns: 320px 1fr;
    }
    .sidebar-controls {
        position: sticky;
        top: 20px;
        height: max-content;
    }
}

.control-panel {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #233554;
    margin-bottom: 20px;
}

.control-panel h3 {
    color: var(--white);
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 16px;
    border-bottom: 1px solid #233554;
    padding-bottom: 8px;
}

.directory-box {
    margin-bottom: 15px;
}

.directory-box label {
    display: block;
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

.directory-select {
    width: 100%;
    padding: 12px 15px;
    background: var(--primary);
    border: 1px solid #233554;
    border-radius: 6px;
    color: var(--white);
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

.search-box input {
    width: 100%;
    padding: 14px 20px;
    background: var(--card-bg);
    border: 1px solid #233554;
    border-radius: 8px;
    color: var(--white);
    font-size: 15px;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent);
}

.card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px -15px rgba(2,12,27,0.7);
    border-top: 4px solid #233554;
    position: relative;
}

.card.trending {
    border-top-color: var(--accent);
}

.trending-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(100,255,218,0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.meta-info {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.question-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 18px;
}

.action-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
}

.answer-box {
    display: none;
    margin-top: 20px;
    border-top: 1px solid #233554;
    padding-top: 20px;
}

.answer-box.show {
    display: block;
}

.answer-title {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 12px;
}

.answer-content {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
}

.fail-box {
    background: rgba(255, 77, 77, 0.07);
    border: 1px solid var(--danger);
    color: #ff6b6b;
    padding: 14px;
    border-radius: 6px;
    margin-top: 15px;
    font-size: 13px;
}

.reg-badge {
    display: inline-block;
    background: #172a45;
    color: var(--white);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-top: 15px;
    border: 1px solid #233554;
}

.loading {
    text-align: center;
    padding: 40px;
    color: var(--accent);
}

.stats {
    background: rgba(100, 255, 218, 0.1);
    border: 1px solid #233554;
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 15px;
}

/* Bottom nav for modes */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020c1b;
    border-top: 1px solid #233554;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 50;
}

.bottom-nav button {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 10px;
}

.bottom-nav button.active {
    color: var(--accent);
}

/* Tag buttons */
.tag-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.tag-btn {
    border-radius: 999px;
    border: 1px solid #233554;
    background: #020c1b;
    color: var(--text);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
}

.tag-btn.active-bookmark {
    border-color: var(--accent);
    color: var(--accent);
}

.tag-btn.active-weak {
    border-color: var(--danger);
    color: var(--danger);
}

.tag-btn.active-strong {
    border-color: #4caf50;
    color: #4caf50;
}

/* Surveyor profile modal */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2,12,27,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    max-width: 420px;
    width: 90%;
    border: 1px solid #233554;
}

.modal h3 {
    margin-top: 0;
    color: var(--white);
}

.modal-close {
    text-align: right;
    margin-bottom: 10px;
}

.modal-close button {
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>AstroMate Orals</h1>
    <div class="subtitle">Premium Chief Mate Prep Dashboard</div>
</header>

<div class="main-layout">

    <div class="sidebar-controls">
        <div class="control-panel">
            <h3>Syllabus Relational Filters</h3>

            <div class="directory-box">
                <label>Filter by Surveyor</label>
                <select id="surveyorSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="all">All Surveyors</option>
                </select>
            </div>

            <div class="directory-box">
                <label>Filter by Function</label>
                <select id="functionSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="all">All Functions</option>
                </select>
            </div>

            <div class="directory-box">
                <label>Filter by Tag</label>
                <select id="tagFilterSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="none">No Tag Filter</option>
                    <option value="bookmark">Bookmarked</option>
                    <option value="weak">Weak</option>
                    <option value="strong">Strong</option>
                </select>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search questions..." onkeyup="runGlobalPipeline()">
            </div>

        </div>

        <div class="control-panel">
            <h3>Smart Modes</h3>
            <button class="action-btn" onclick="startDaily20()">🎯 Daily 20 Questions</button>
            <button class="action-btn" style="margin-top:10px;" onclick="startMockViva()">🎤 Start Mock Viva</button>
        </div>
    </div>

    <div class="content-area">
        <div id="loadingMsg" class="loading">⏳ Loading questions...</div>
        <div id="stats" class="stats" style="display:none;"></div>
        <div id="questionsContainer"></div>
    </div>

</div>

<!-- Bottom nav -->
<div class="bottom-nav">
    <button id="modeAllBtn" class="active" onclick="setMode('all')">All Questions</button>
    <button id="modeDailyBtn" onclick="setMode('daily')">Daily 20</button>
    <button id="modeVivaBtn" onclick="setMode('viva')">Mock Viva</button>
</div>

<!-- Surveyor profile modal -->
<div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
        <div class="modal-close">
            <button onclick="closeSurveyorModal()">✕ Close</button>
        </div>
        <h3 id="modalSurveyorName">Surveyor</h3>
        <p id="modalSurveyorCenter"></p>
        <p id="modalSurveyorStats"></p>
        <ul id="modalSurveyorFunctions"></ul>
    </div>
</div>
