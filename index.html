<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0a192f;
            margin: 0;
            padding: 0;
            color: #8892b0;
            padding-bottom: 60px;
        }
        header {
            background-color: #020c1b;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #112240;
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            color: #e6f1ff;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: #64ffda;
            margin-top: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .control-panel {
            background-color: #112240;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #233554;
            margin-bottom: 20px;
        }
        .control-panel h3 {
            color: #e6f1ff;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #233554;
            padding-bottom: 8px;
        }
        .directory-box label {
            display: block;
            color: #e6f1ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .directory-select {
            width: 100%;
            padding: 12px 15px;
            background-color: #0a192f;
            border: 1px solid #233554;
            border-radius: 6px;
            color: #e6f1ff;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .profile-card {
            background-color: #172a45;
            border: 1px solid #64ffda;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .profile-title {
            color: #e6f1ff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-meta {
            color: #64ffda;
            font-size: 12px;
            font-weight: 600;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            background-color: #112240;
            border: 1px solid #233554;
            border-radius: 8px;
            color: #e6f1ff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .tabs-container {
            display: flex;
            background-color: #020c1b;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #233554;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: #8892b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #112240;
            color: #64ffda;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .filter-chip {
            background-color: #0a192f;
            border: 1px solid #233554;
            color: #e6f1ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 11px;
        }
        .filter-chip.active {
            border-color: #64ffda;
            color: #64ffda;
            background-color: rgba(100, 255, 218, 0.05);
        }
        .stats-banner {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            flex: 1;
            background-color: #112240;
            border: 1px solid #233554;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-val {
            font-size: 20px;
            font-weight: 700;
            color: #64ffda;
        }
        .stat-lbl {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .card {
            background-color: #112240;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border-top: 4px solid #233554;
            position: relative;
        }
        .card.hot {
            border-top-color: #ff4d4d;
        }
        .meta-info {
            font-size: 11px;
            color: #64ffda;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            gap: 15px;
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #e6f1ff;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .action-btn {
            background: transparent;
            border: 1px solid #64ffda;
            color: #64ffda;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .answer-box {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #233554;
            padding-top: 20px;
        }
        .answer-title {
            font-weight: bold;
            color: #64ffda;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .answer-content {
            font-size: 14.5px;
            line-height: 1.6;
            color: #8892b0;
        }
        .fail-box {
            background-color: rgba(255, 77, 77, 0.07);
            border: 1px solid #ff4d4d;
            color: #ff6b6b;
            padding: 14px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
        }
        .fail-box strong {
            color: #ff4d4d;
            text-transform: uppercase;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .reg-badge {
            display: inline-block;
            background-color: #172a45;
            color: #e6f1ff;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-weight: 600;
            border: 1px solid #233554;
        }
        .faq-container {
            display: none;
        }
        .faq-item {
            background-color: #112240;
            border: 1px solid #233554;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .faq-trigger {
            padding: 18px 20px;
            color: #e6f1ff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            background-color: #112240;
        }
        .faq-content {
            display: none;
            padding: 20px;
            border-top: 1px solid #233554;
            font-size: 14px;
            line-height: 1.6;
            background-color: rgba(2, 12, 27, 0.3);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            background-color: #112240;
            border-radius: 12px;
            border: 1px dashed #233554;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>AstroMate Orals</h1>
        <div class="subtitle">Premium Chief Mate Prep Dashboard</div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Controls -->
        <div class="control-panel">
            <h3>Active Profile</h3>
            <div class="directory-box">
                <label for="profileSelect">Select Syllabus Route</label>
                <select id="profileSelect" class="directory-select">
                    <option value="" selected disabled>Choose Profile...</option>
                    <option value="uk-mca">UK MCA (Chief Mate Reg II/2)</option>
                    <option value="uscg">USCG (Chief Mate Unlimited)</option>
                    <option value="amsa">AMSA (Master/Chief Mate)</option>
                </select>
            </div>
            
            <div id="profileCard" class="profile-card">
                <div id="profileName" class="profile-title">--</div>
                <div id="profileMeta" class="profile-meta">--</div>
            </div>
        </div>

        <div class="stats-banner">
            <div class="stat-box">
                <div id="totalQuestions" class="stat-val">3</div>
                <div class="stat-lbl">Questions</div>
            </div>
            <div class="stat-box">
                <div id="criticalCount" class="stat-val" style="color: #ff4d4d">2</div>
                <div class="stat-lbl">Instant Fails</div>
            </div>
        </div>

        <!-- Main Content Feed -->
        <div class="search-box">
