<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>

<style>
:root {
    --primary: #0a192f;
    --accent: #64ffda;
    --text: #8892b0;
    --white: #e6f1ff;
    --card-bg: #112240;
    --dark-blue: #020c1b;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--primary);
    margin: 0;
    padding: 0;
    color: var(--text);
    padding-bottom: 60px;
}

header {
    background: var(--dark-blue);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 2px solid var(--card-bg);
}

header h1 {
    margin: 0;
    font-size: 28px;
    color: var(--white);
    font-weight: 700;
}

.subtitle {
    font-size: 13px;
    color: var(--accent);
    margin-top: 5px;
    font-weight: 600;
    text-transform: uppercase;
}

.main-layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media(min-width: 900px) {
    .main-layout {
        grid-template-columns: 320px 1fr;
    }
    .sidebar-controls {
        position: sticky;
        top: 20px;
        height: max-content;
    }
}

.control-panel {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #233554;
    margin-bottom: 20px;
}

.control-panel h3 {
    color: var(--white);
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 16px;
    border-bottom: 1px solid #233554;
    padding-bottom: 8px;
}

.directory-box {
    margin-bottom: 15px;
}

.directory-box label {
    display: block;
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

.directory-select {
    width: 100%;
    padding: 12px 15px;
    background: var(--primary);
    border: 1px solid #233554;
    border-radius: 6px;
    color: var(--white);
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

.search-box input {
    width: 100%;
    padding: 14px 20px;
    background: var(--card-bg);
    border: 1px solid #233554;
    border-radius: 8px;
    color: var(--white);
    font-size: 15px;
    outline: none;
}

.search-box input:focus {
    border-color: var(--accent);
}

.card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px -15px rgba(2,12,27,0.7);
    border-top: 4px solid #233554;
}

.meta-info {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
    display: flex;
    gap: 15px;
}

.question-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 18px;
}

.action-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
}

.answer-box {
    display: none;
    margin-top: 20px;
    border-top: 1px solid #233554;
    padding-top: 20px;
}

.answer-box.show {
    display: block;
}

.answer-title {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 12px;
}

.answer-content {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
}

.fail-box {
    background: rgba(255, 77, 77, 0.07);
    border: 1px solid #ff4d4d;
    color: #ff6b6b;
    padding: 14px;
    border-radius: 6px;
    margin-top: 15px;
    font-size: 13px;
}

.reg-badge {
    display: inline-block;
    background: #172a45;
    color: var(--white);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-top: 15px;
    border: 1px solid #233554;
}

.loading {
    text-align: center;
    padding: 40px;
    color: var(--accent);
}

.stats {
    background: rgba(100, 255, 218, 0.1);
    border: 1px solid #233554;
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <h1>AstroMate Orals</h1>
    <div class="subtitle">Premium Chief Mate Prep Dashboard</div>
</header>

<div class="main-layout">

<div class="sidebar-controls">
<div class="control-panel">
<h3>Syllabus Relational Filters</h3>

<div class="directory-box">
<label>Filter by Surveyor</label>
<select id="surveyorSelect" class="directory-select" onchange="runGlobalPipeline()">
    <option value="all">All Surveyors</option>
</select>
</div>

<div class="directory-box">
<label>Filter by Function</label>
<select id="functionSelect" class="directory-select" onchange="runGlobalPipeline()">
    <option value="all">All Functions</option>
</select>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search questions..." onkeyup="runGlobalPipeline()">
</div>

</div>
</div>

<div class="content-area">
<div id="loadingMsg" class="loading">⏳ Loading questions...</div>
<div id="stats" class="stats" style="display:none;"></div>
<div id="questionsContainer"></div>
</div>

</div>

<script>
let allQuestions = [];

async function loadCSV() {
    try {
        const csvUrl = 'https://raw.githubusercontent.com/NFR23OFF/astromateoral/main/database.csv';
        const response = await fetch(csvUrl);
        const text = await response.text();
        parseCSV(text);
        populateSurveyorDropdown();
        populateFunctionDropdown();
        runGlobalPipeline();
    } catch (error) {
        document.getElementById('loadingMsg').innerHTML = "❌ Error loading CSV";
    }
}

function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());

    for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        const q = {};
        headers.forEach((h, idx) => q[h] = values[idx] || "");
        if (q['Question']) allQuestions.push(q);
    }
}

function parseCSVLine(line) {
    const result = [];
    let current = '';
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];

        if (char === '"') {
            if (insideQuotes && next === '"') {
                current += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }
        } else if (char === ',' && !insideQuotes) {
            result.push(current);
            current = '';
        } else {
            current += char;
        }
    }
    result.push(current);
    return result;
}

function populateSurveyorDropdown() {
    const dropdown = document.getElementById('surveyorSelect');
    const uniqueSurveyors = [...new Set(allQuestions.map(q => q['Surveyor_Name']))];

    uniqueSurveyors.forEach(name => {
        if (name && name.trim() !== "") {
            const option = document.createElement('option');
            option.value = name.toLowerCase();
            option.textContent = name;
            dropdown.appendChild(option);
        }
    });
}

function populateFunctionDropdown() {
    const dropdown = document.getElementById('functionSelect');
    const uniqueFunctions = [...new Set(allQuestions.map(q => q['Function_Number']))];

    uniqueFunctions.forEach(func => {
        if (func && func.trim() !== "") {
            const option = document.createElement('option');
            option.value = func.toLowerCase();
            option.textContent = func;
            dropdown.appendChild(option);
        }
    });
}

function runGlobalPipeline() {
    const surveyor = document.getElementById('surveyorSelect').value.toLowerCase();
    const func = document.getElementById('functionSelect').value.toLowerCase();
    const search = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allQuestions.filter(q => {
        let match = true;

        if (surveyor !== 'all') {
            match = match && q['Surveyor_Name'].toLowerCase().includes(surveyor);
        }

        if (func !== 'all') {
            match = match && q['Function_Number'].toLowerCase().includes(func);
        }

        if (search) {
            const combined = (q['Question'] + " " + q['Expected_Answer']).toLowerCase();
            match = match && combined.includes(search);
        }

        return match;
    });

    displayQuestions(filtered);
}

function displayQuestions(list) {
    const container = document.getElementById('questionsContainer');
    const stats = document.getElementById('stats');
    const loading = document.getElementById('loadingMsg');

    loading.style.display = 'none';

    stats.style.display = 'block';
    stats.textContent = `📊 Showing ${list.length} of ${allQuestions.length} questions`;

    container.innerHTML = list.map((q, i) => `
        <div class="card">
            <div class="meta-info">
                <span>Q${i + 1}</span>
                <span>${q['Function_Number']}</span>
                <span>${q['MMD_Center']}</span>
            </div>

            <div class="question-text">${q['Question']}</div>

            <button class="action-btn" onclick="toggleAnswer(this)">▼ Show Answer</button>

            <div class="answer-box">
                <div class="answer-title">✓ Answer:</div>
                <div class="answer-content">${q['Expected_Answer']}</div>

                ${q['Fail_Trigger'] ? `<div class="fail-box"><strong>Fail Trigger:</strong> ${q['Fail_Trigger']}</div>` : ''}

                ${q['Reg_Source'] ? `<div class="reg-badge">Source: ${q['Reg_Source']}</div>` : ''}
            </div>
        </div>
    `).join('');
}

function toggleAnswer(btn) {
    const box = btn.nextElementSibling;
    box.classList.toggle('show');
    btn.textContent = box.classList.contains('show') ? "▲ Hide Answer" : "▼ Show Answer";
}

window.addEventListener('DOMContentLoaded', loadCSV);
</script>

</body>
</html>
