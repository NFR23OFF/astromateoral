<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>
    <style>
        :root { 
            --primary: #0a192f; 
            --accent: #64ffda; 
            --text: #8892b0; 
            --white: #e6f1ff; 
            --card-bg: #112240; 
            --dark-blue: #020c1b;
            --danger: #ff4d4d;
            --warning: #ffb703;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--primary); 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            padding-bottom: 60px; 
        }
        header { 
            background: var(--dark-blue); 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 2px solid var(--card-bg); 
        }
        header h1 { 
            margin: 0; 
            font-size: 28px; 
            color: var(--white); 
            font-weight: 700; 
            letter-spacing: 1px; 
        }
        .subtitle { 
            font-size: 13px; 
            color: var(--accent); 
            margin-top: 5px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 900px) {
            .main-layout {
                grid-template-columns: 320px 1fr;
            }
            .sidebar-controls {
                position: sticky;
                top: 20px;
                height: max-content;
            }
        }
        .control-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #233554;
            margin-bottom: 20px;
        }
        .control-panel h3 {
            color: var(--white);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #233554;
            padding-bottom: 8px;
        }
        .directory-box {
            margin-bottom: 15px;
        }
        .directory-box label { 
            display: block; 
            color: var(--white); 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
        .directory-select { 
            width: 100%; 
            padding: 12px 15px; 
            background: var(--primary); 
            border: 1px solid #233554; 
            border-radius: 6px; 
            color: var(--white); 
            font-size: 14px; 
            outline: none; 
            cursor: pointer; 
        }
        .search-box { margin-bottom: 20px; }
        .search-box input { 
            width: 100%; 
            padding: 14px 20px; 
            background: var(--card-bg); 
            border: 1px solid #233554; 
            border-radius: 8px; 
            color: var(--white); 
            font-size: 15px; 
            box-sizing: border-box; 
            outline: none; 
        }
        .search-box input:focus { border-color: var(--accent); }

        .tabs-container {
            display: flex;
            background: var(--dark-blue);
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #233554;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent);
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .filter-chip { 
            background: var(--primary); 
            border: 1px solid #233554; 
            color: var(--white); 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 11px; 
        }
        .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.05); }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px -15px rgba(2,12,27,0.7); 
            border-top: 4px solid #233554; 
            position: relative; 
        }
        .card.hot { border-top-color: #ff4d4d; }
        .card.hot::after { 
            content: '⚠️ SAFETY CRITICAL'; 
            position: absolute; 
            top: 24px; 
            right: 24px; 
            color: #ff4d4d; 
            font-size: 10px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }
        .meta-info { 
            font-size: 11px; 
            color: var(--accent); 
            margin-bottom: 12px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            display: flex;
            gap: 15px;
        }
        .question-text { font-size: 16px; font-weight: 600; color: var(--white); margin-bottom: 18px; line-height: 1.5; }
        
        .action-btn { 
            background: transparent; 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            padding: 10px 15px; 
            border-radius: 4px; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .action-btn:hover { background: rgba(100, 255, 218, 0.1); }
        
        .answer-box { 
            display: none; 
            margin-top: 20px; 
            border-top: 1px solid #233554; 
            padding-top: 20px; 
        }
        .answer-box.show { display: block; }
        .answer-title { font-weight: bold; color: var(--accent); margin-bottom: 8px; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }
        .answer-content { font-size: 14.5px; line-height: 1.6; color: var(--text); }
        
        .fail-box { 
            background: rgba(255, 77, 77, 0.07); 
            border: 1px solid #ff4d4d; 
            color: #ff6b6b; 
            padding: 14px; 
            border-radius: 6px; 
            margin-top: 15px; 
            font-size: 13px; 
            line-height: 1.5; 
        }
        .fail-box strong {
            color: #ff4d4d;
            text-transform: uppercase;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .reg-badge { 
            display: inline-block; 
            background: #172a45; 
            color: var(--white); 
            font-size: 11px; 
            padding: 4px 10px; 
            border-radius: 4px; 
            margin-top: 15px; 
            font-weight: 600; 
            border: 1px solid #233554; 
        }
        .empty-state { text-align: center; padding: 40px; background: var(--card-bg); border-radius: 12px; border: 1px dashed #233554; }
        .loading { text-align: center; padding: 40px; color: var(--accent); }
        .questions-container { width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>AstroMate Orals</h1>
        <div class="subtitle">Premium Chief Mate Prep Dashboard</div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Navigation Controls -->
        <div class="sidebar-controls">
            <div class="control-panel">
                <h3>Syllabus Relational Filters</h3>
                
                <div class="directory-box">
                    <label for="surveyorSelect">Filter by Target Surveyor</label>
                    <select id="surveyorSelect" class="directory-select" onchange="runGlobalPipeline()">
                        <option value="all">All Surveyors</option>
                        <option value="Nitin Mukesh">Capt. Nitin Mukesh / Capt. SB Kumar</option>
                        <option value="Hemant Jarwal">Capt. Hemant Jarwal / Capt. Panigrahi</option>
                        <option value="Daniel Joseph">Capt. Daniel Joseph / Capt. Pramod Sharda</option>
                        <option value="Ravi Singh">Capt. Ravi Singh Sikarwar / Capt. V. K. Sood</option>
                        <option value="Poswal">Capt. R. Poswal / Capt. N. Nayar</option>
                    </select>
                </div>

                <div class="directory-box">
                    <label for="functionSelect">Filter by Exam Function</label>
                    <select id="functionSelect" class="directory-select" onchange="runGlobalPipeline()">
                        <option value="all">All Functions</option>
                        <option value="F1">Function 1 (Navigation / ROR)</option>
                        <option value="F2">Function 2 (Cargo Ops / Stability)</option>
                        <option value="F3">Function 3 (Legislation / Safety)</option>
                    </select>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search questions..." onkeyup="runGlobalPipeline()">
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content-area">
            <div id="loadingMsg" class="loading">Loading questions...</div>
            <div id="questionsContainer" class="questions-container"></div>
            <div id="emptyState" class="empty-state" style="display:none;">No questions found. Try adjusting your filters.</div>
        </div>
    </div>

    <script>
        let allQuestions = [];

        // Load CSV data
        async function loadCSV() {
            try {
                const response = await fetch('database.csv');
                const text = await response.text();
                parseCSV(text);
                runGlobalPipeline();
            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('loadingMsg').textContent = 'Error loading questions. Please refresh.';
            }
        }

        // Parse CSV data
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                // Handle CSV with possible quoted fields
                const values = parseCSVLine(lines[i]);
                
                if (values.length >= headers.length) {
                    const question = {};
                    headers.forEach((header, index) => {
                        question[header] = values[index] ? values[index].trim() : '';
                    });
                    allQuestions.push(question);
                }
            }
            
            console.log(`Loaded ${allQuestions.length} questions`);
        }

        // Helper to parse CSV lines with quoted fields
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];
                
                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        // Filter and display questions
        function runGlobalPipeline() {
            const surveyor = document.getElementById('surveyorSelect').value;
            const func = document.getElementById('functionSelect').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allQuestions.filter(q => {
                let match = true;

                if (surveyor !== 'all') {
                    match = match && (q['Surveyor'] && q['Surveyor'].includes(surveyor));
                }

                if (func !== 'all') {
                    match = match && (q['Function'] && q['Function'].includes(func));
                }

                if (search) {
                    const searchFields = (q['Question'] || '') + ' ' + (q['Answer'] || '') + ' ' + (q['Topic'] || '');
                    match = match && searchFields.toLowerCase().includes(search);
                }

                return match;
            });

            displayQuestions(filtered);
        }

        // Display questions as cards
        function displayQuestions(questions) {
            const container = document.getElementById('questionsContainer');
            const emptyState = document.getElementById('emptyState');
            const loadingMsg = document.getElementById('loadingMsg');

            loadingMsg.style.display = 'none';

            if (questions.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = questions.map((q, index) => `
                <div class="card ${q['Safety-Critical'] === 'Yes' ? 'hot' : ''}">
                    <div class="meta-info">
                        <span>Q#${index + 1}</span>
                        ${q['Function'] ? `<span>${q['Function']}</span>` : ''}
                        ${q['Topic'] ? `<span>${q['Topic']}</span>` : ''}
                        ${q['Surveyor'] ? `<span>${q['Surveyor']}</span>` : ''}
                    </div>
                    <div class="question-text">${q['Question'] || 'No question text'}</div>
                    <button class="action-btn" onclick="toggleAnswer(this)">Show Answer</button>
                    <div class="answer-box">
                        <div class="answer-title">Answer:</div>
                        <div class="answer-content">${q['Answer'] || 'No answer provided'}</div>
                        ${q['Notes'] ? `<div class="fail-box"><strong>Additional Notes:</strong>${q['Notes']}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Toggle answer visibility
        function toggleAnswer(button) {
            const answerBox = button.nextElementSibling;
            answerBox.classList.toggle('show');
            button.textContent = answerBox.classList.contains('show') ? 'Hide Answer' : 'Show Answer';
        }

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadCSV);
    </script>
</body>
</html>
