<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>

<style>
:root {
    --primary-dark: #0a192f;
    --primary-light: #f5f7fb;
    --accent: #64ffda;
    --text-dark: #8892b0;
    --text-light: #1f2933;
    --white: #e6f1ff;
    --card-bg-dark: rgba(17,34,64,0.85);
    --card-bg-light: rgba(255,255,255,0.85);
    --dark-blue: #020c1b;
    --danger: #ff4d4d;
}

/* Theme handling */
html[data-theme="dark"] body {
    background: radial-gradient(circle at top, #112240 0, #020c1b 40%, #000 100%);
    color: var(--text-dark);
}
html[data-theme="light"] body {
    background: var(--primary-light);
    color: var(--text-light);
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    padding: 0;
    padding-bottom: 80px;
    transition: background 0.3s ease, color 0.3s ease;
}

header {
    background: linear-gradient(135deg, #020c1b, #112240);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 2px solid rgba(255,255,255,0.05);
    position: relative;
}

header h1 {
    margin: 0;
    font-size: 28px;
    color: var(--white);
    font-weight: 700;
}

.subtitle {
    font-size: 13px;
    color: var(--accent);
    margin-top: 5px;
    font-weight: 600;
    text-transform: uppercase;
}

/* Theme toggle */
.theme-toggle {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--accent);
    font-size: 12px;
}
.theme-toggle button {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--accent);
    cursor: pointer;
    font-size: 11px;
}

/* Exam mode badge */
.exam-mode-badge {
    position: absolute;
    bottom: 12px;
    right: 20px;
    font-size: 11px;
    color: var(--accent);
    opacity: 0.8;
}

.main-layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media(min-width: 900px) {
    .main-layout {
        grid-template-columns: 320px 1fr;
    }
    .sidebar-controls {
        position: sticky;
        top: 20px;
        height: max-content;
    }
}

/* Glassmorphism panels */
.control-panel {
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 20px;
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.7);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
html[data-theme="dark"] .control-panel {
    background: var(--card-bg-dark);
}
html[data-theme="light"] .control-panel {
    background: var(--card-bg-light);
}
.control-panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 50px -24px rgba(0,0,0,0.8);
}

.control-panel h3 {
    color: var(--white);
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 8px;
}

/* Dashboard */
.dashboard {
    font-size: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}
.dashboard span {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(0,0,0,0.2);
    color: var(--accent);
}

/* Inputs */
.directory-box {
    margin-bottom: 15px;
}
.directory-box label {
    display: block;
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}
.directory-select {
    width: 100%;
    padding: 12px 15px;
    background: rgba(2,12,27,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--white);
    font-size: 14px;
    outline: none;
    cursor: pointer;
}
.search-box input {
    width: 100%;
    padding: 14px 20px;
    background: rgba(2,12,27,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--white);
    font-size: 15px;
    outline: none;
}
.search-box input:focus {
    border-color: var(--accent);
}

/* Cards */
.card {
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.7);
    position: relative;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.25s ease forwards;
}
html[data-theme="dark"] .card {
    background: var(--card-bg-dark);
}
html[data-theme="light"] .card {
    background: var(--card-bg-light);
}
.card.trending {
    border-color: var(--accent);
}
.trending-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(100,255,218,0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.meta-info {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.question-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 18px;
}

/* Difficulty badge */
.difficulty-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 6px;
}
.diff-easy {
    border: 1px solid #4caf50;
    color: #4caf50;
}
.diff-medium {
    border: 1px solid #ffb703;
    color: #ffb703;
}
.diff-hard {
    border: 1px solid #ff4d4d;
    color: #ff4d4d;
}

/* Buttons */
.action-btn {
    background: linear-gradient(135deg, #020c1b, #112240);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -16px rgba(0,0,0,0.8);
    background: linear-gradient(135deg, #112240, #020c1b);
}

/* Answer box */
.answer-box {
    display: none;
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
}
.answer-box.show {
    display: block;
}
.answer-title {
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 12px;
}
.answer-content {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--white);
}

/* Fail + Reg */
.fail-box {
    background: rgba(255, 77, 77, 0.07);
    border: 1px solid var(--danger);
    color: #ff6b6b;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 13px;
}
.reg-badge {
    display: inline-block;
    background: rgba(23,42,69,0.9);
    color: var(--white);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 15px;
    border: 1px solid rgba(255,255,255,0.08);
}

/* Tags */
.tag-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.tag-btn {
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(2,12,27,0.8);
    color: var(--white);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
}
.tag-btn.active-bookmark {
    border-color: var(--accent);
    color: var(--accent);
}
.tag-btn.active-weak {
    border-color: var(--danger);
    color: var(--danger);
}
.tag-btn.active-strong {
    border-color: #4caf50;
    color: #4caf50;
}

/* Loading + stats */
.loading {
    text-align: center;
    padding: 40px;
    color: var(--accent);
}
.stats {
    background: rgba(100, 255, 218, 0.1);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--accent);
    padding: 10px 15px;
    border-radius: 999px;
    font-size: 12px;
    margin-bottom: 15px;
}

/* Bottom nav */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020c1b;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 50;
}
.bottom-nav button {
    background: transparent;
    border: none;
    color: var(--white);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 10px;
}
.bottom-nav button.active {
    color: var(--accent);
}

/* Modal */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2,12,27,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
.modal {
    border-radius: 16px;
    padding: 20px;
    max-width: 420px;
    width: 90%;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
}
html[data-theme="dark"] .modal {
    background: var(--card-bg-dark);
}
html[data-theme="light"] .modal {
    background: var(--card-bg-light);
}
.modal h3 {
    margin-top: 0;
    color: var(--white);
}
.modal-close {
    text-align: right;
    margin-bottom: 10px;
}
.modal-close button {
    background: transparent;
    border: none;
    color: var(--white);
    cursor: pointer;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>AstroMate Orals</h1>
    <div class="subtitle">Premium Chief Mate Prep Dashboard</div>

    <div class="theme-toggle">
        <span>Theme</span>
        <button onclick="setTheme('dark')">Dark</button>
        <button onclick="setTheme('light')">Light</button>
    </div>

    <div class="exam-mode-badge" id="examModeBadge">
        Mode: Normal
    </div>
</header>

<div class="main-layout">

    <div class="sidebar-controls">
        <div class="control-panel">
            <h3>Syllabus Relational Filters</h3>

            <div class="dashboard" id="dashboard">
                <span id="dashTotal">Total: 0</span>
                <span id="dashBookmark">⭐ Bookmarks: 0</span>
                <span id="dashWeak">❗ Weak: 0</span>
                <span id="dashStrong">✔ Strong: 0</span>
            </div>

            <div class="directory-box">
                <label>Filter by Surveyor</label>
                <select id="surveyorSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="all">All Surveyors</option>
                </select>
            </div>

            <div class="directory-box">
                <label>Filter by Function</label>
                <select id="functionSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="all">All Functions</option>
                </select>
            </div>

            <div class="directory-box">
                <label>Filter by Tag</label>
                <select id="tagFilterSelect" class="directory-select" onchange="runGlobalPipeline()">
                    <option value="none">No Tag Filter</option>
                    <option value="bookmark">Bookmarked</option>
                    <option value="weak">Weak</option>
                    <option value="strong">Strong</option>
                </select>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search questions..." onkeyup="runGlobalPipeline()">
            </div>

        </div>

        <div class="control-panel">
            <h3>Smart Modes</h3>
            <button class="action-btn" onclick="startDaily20()">🎯 Daily 20 Questions</button>
            <button class="action-btn" style="margin-top:10px;" onclick="startMockViva()">🎤 Start Mock Viva</button>
            <button class="action-btn" style="margin-top:10px;" onclick="toggleExamMode()">📘 Exam Day Mode</button>
        </div>
    </div>

    <div class="content-area">
        <div id="loadingMsg" class="loading">⏳ Loading questions...</div>
        <div id="stats" class="stats" style="display:none;"></div>
        <div id="questionsContainer"></div>
    </div>

</div>

<div class="bottom-nav">
    <button id="modeAllBtn" class="active" onclick="setMode('all')">All Questions</button>
    <button id="modeDailyBtn" onclick="setMode('daily')">Daily 20</button>
    <button id="modeVivaBtn" onclick="setMode('viva')">Mock Viva</button>
</div>

<div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
        <div class="modal-close">
            <button onclick="closeSurveyorModal()">✕ Close</button>
        </div>
        <h3 id="modalSurveyorName">Surveyor</h3>
        <p id="modalSurveyorCenter"></p>
        <p id="modalSurveyorStats"></p>
        <ul id="modalSurveyorFunctions"></ul>
    </div>
</div>

<script>
let allQuestions = [];
let currentMode = 'all';
let dailyQuestions = [];
let vivaIndex = 0;
let examMode = false;

let tags = {
    bookmark: new Set(),
    weak: new Set(),
    strong: new Set()
};

async function loadCSV() {
    try {
        const csvUrl = 'https://raw.githubusercontent.com/NFR23OFF/astromateoral/main/database.csv';
        const response = await fetch(csvUrl);
        const text = await response.text();
        parseCSV(text);
        populateSurveyorDropdown();
        populateFunctionDropdown();
        runGlobalPipeline();
    } catch (error) {
        document.getElementById('loadingMsg').innerHTML = "❌ Error loading CSV";
    }
}

function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const q = {};
        headers.forEach((h, idx) => q[h] = values[idx] || "");
        if (q['Question']) {
            q._difficulty = inferDifficulty(q);
            allQuestions.push(q);
        }
    }
}

function parseCSVLine(line) {
    const result = [];
    let current = '';
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];

        if (char === '"') {
            if (insideQuotes && next === '"') {
                current += '"';
                i++;
            } else {
                insideQuotes = !insideQuotes;
            }
        } else if (char === ',' && !insideQuotes) {
            result.push(current);
            current = '';
        } else {
            current += char;
        }
    }
    result.push(current);
    return result;
}

function inferDifficulty(q) {
    const ans = (q['Expected_Answer'] || '').trim();
    const fail = (q['Fail_Trigger'] || '').trim();
    const reg = (q['Reg_Source'] || '').toLowerCase();

    const length = ans.length;
    let score = 0;

    if (length < 80) score += 1;
    else if (length < 200) score += 2;
    else score += 3;

    if (fail) score += 1;
    if (reg.includes('solas') || reg.includes('marpol') || reg.includes('ism')) score += 1;

    if (score <= 2) return 'easy';
    if (score <= 3) return 'medium';
    return 'hard';
}

function cleanSurveyorName(name) {
    return name.toLowerCase().replace("capt.", "").trim();
}

function populateSurveyorDropdown() {
    const dropdown = document.getElementById('surveyorSelect');
    const uniqueSurveyors = [...new Set(allQuestions.map(q => q['Surveyor_Name']))];

    uniqueSurveyors.forEach(name => {
        if (name && name.trim() !== "") {
            const option = document.createElement('option');
            option.value = cleanSurveyorName(name);
            option.textContent = name;
            dropdown.appendChild(option);
        }
    });
}

function populateFunctionDropdown() {
    const dropdown = document.getElementById('functionSelect');
    const uniqueFunctions = [...new Set(allQuestions.map(q => q['Function_Number']))];

    uniqueFunctions.forEach(func => {
        if (func && func.trim() !== "") {
            const option = document.createElement('option');
            option.value = func.toLowerCase();
            option.textContent = func;
            dropdown.appendChild(option);
        }
    });
}

function setMode(mode) {
    currentMode = mode;
    document.getElementById('modeAllBtn').classList.toggle('active', mode === 'all');
    document.getElementById('modeDailyBtn').classList.toggle('active', mode === 'daily');
    document.getElementById('modeVivaBtn').classList.toggle('active', mode === 'viva');
    runGlobalPipeline();
}

function runGlobalPipeline() {
    const surveyor = document.getElementById('surveyorSelect').value.toLowerCase();
    const func = document.getElementById('functionSelect').value.toLowerCase();
    const tagFilter = document.getElementById('tagFilterSelect').value;
    const search = document.getElementById('searchInput').value.toLowerCase();

    let baseList = [...allQuestions];

    if (currentMode === 'daily' && dailyQuestions.length > 0) {
        baseList = dailyQuestions;
    } else if (currentMode === 'viva' && dailyQuestions.length > 0) {
        baseList = dailyQuestions;
    }

    let filtered = baseList.filter((q, idx) => {
        let match = true;

        if (surveyor !== 'all') {
            const cleaned = cleanSurveyorName(q['Surveyor_Name'] || "");
            match = match && cleaned.includes(surveyor);
        }

        if (func !== 'all') {
            const fn = (q['Function_Number'] || "").toLowerCase();
            match = match && fn.includes(func);
        }

        if (search) {
            const combined = ((q['Question'] || "") + " " + (q['Expected_Answer'] || "")).toLowerCase();
            match = match && combined.includes(search);
        }

        if (tagFilter !== 'none') {
            const id = getQuestionId(q, idx);
            if (tagFilter === 'bookmark') match = match && tags.bookmark.has(id);
            if (tagFilter === 'weak') match = match && tags.weak.has(id);
            if (tagFilter === 'strong') match = match && tags.strong.has(id);
        }

        return match;
    });

    displayQuestions(filtered);
    updateDashboard();
}

function getQuestionId(q, index) {
    return `${index}-${(q['Question'] || '').slice(0, 50)}`;
}

function displayQuestions(list) {
    const container = document.getElementById('questionsContainer');
    const stats = document.getElementById('stats');
    const loading = document.getElementById('loadingMsg');

    loading.style.display = 'none';

    stats.style.display = 'block';
    stats.textContent = `📊 Showing ${list.length} of ${allQuestions.length} questions`;

    container.innerHTML = list.map((q, i) => {
        const id = getQuestionId(q, i);
        const isTrending = (q['Trending_Status'] || '').toLowerCase().includes('hot');

        const isBookmark = tags.bookmark.has(id);
        const isWeak = tags.weak.has(id);
        const isStrong = tags.strong.has(id);

        const diffClass =
            q._difficulty === 'easy' ? 'diff-easy' :
            q._difficulty === 'medium' ? 'diff-medium' :
            'diff-hard';

        const diffLabel =
            q._difficulty === 'easy' ? 'Easy' :
            q._difficulty === 'medium' ? 'Medium' :
            'Hard';

        return `
        <div class="card ${isTrending ? 'trending' : ''}">
            ${isTrending ? `<div class="trending-badge">Trending</div>` : ''}

            <div class="meta-info">
                <span>Q${i + 1}</span>
                ${q['Function_Number'] ? `<span>${q['Function_Number']}</span>` : ''}
                ${q['MMD_Center'] ? `<span>${q['MMD_Center']}</span>` : ''}
                ${q['Surveyor_Name'] ? `<span onclick="openSurveyorModal('${encodeURIComponent(q['Surveyor_Name'])}')" style="cursor:pointer; text-decoration:underline;">${q['Surveyor_Name']}</span>` : ''}
                <span class="difficulty-badge ${diffClass}">${diffLabel}</span>
            </div>

            <div class="question-text">${q['Question']}</div>

            <div class="tag-row">
                <button class="tag-btn ${isBookmark ? 'active-bookmark' : ''}" onclick="toggleTag('bookmark','${id}')">⭐ Bookmark</button>
                <button class="tag-btn ${isWeak ? 'active-weak' : ''}" onclick="toggleTag('weak','${id}')">❗ Weak</button>
                <button class="tag-btn ${isStrong ? 'active-strong' : ''}" onclick="toggleTag('strong','${id}')">✔ Strong</button>
            </div>

            <button class="action-btn" onclick="toggleAnswer(this)">▼ Show Answer</button>

            <div class="answer-box">
                <div class="answer-title">✓ Answer:</div>
                <div class="answer-content">${formatAnswer(q['Expected_Answer'] || 'No answer provided')}</div>

                ${q['Fail_Trigger'] ? `<div class="fail-box"><strong>Fail Trigger:</strong> ${q['Fail_Trigger']}</div>` : ''}

                ${q['Reg_Source'] ? `<div class="reg-badge">Source: ${q['Reg_Source']}</div>` : ''}
            </div>
        </div>
    `;
    }).join('');
}

function formatAnswer(ans) {
    if (!ans) return 'No answer provided';
    const parts = ans.split(/[\r\n]+/).filter(p => p.trim() !== '');
    if (parts.length <= 1) return ans;
    return '<ul>' + parts.map(p => `<li>${p}</li>`).join('') + '</ul>';
}

function toggleAnswer(btn) {
    const box = btn.nextElementSibling;
    box.classList.toggle('show');
    btn.textContent = box.classList.contains('show') ? "▲ Hide Answer" : "▼ Show Answer";
}

function toggleTag(type, id) {
    const set = tags[type];
    if (set.has(id)) {
        set.delete(id);
    } else {
        set.add(id);
    }
    runGlobalPipeline();
}

function updateDashboard() {
    document.getElementById('dashTotal').textContent = `Total: ${allQuestions.length}`;
    document.getElementById('dashBookmark').textContent = `⭐ Bookmarks: ${tags.bookmark.size}`;
    document.getElementById('dashWeak').textContent = `❗ Weak: ${tags.weak.size}`;
    document.getElementById('dashStrong').textContent = `✔ Strong: ${tags.strong.size}`;
}

function openSurveyorModal(encodedName) {
    const name = decodeURIComponent(encodedName);
    const backdrop = document.getElementById('modalBackdrop');
    const nameEl = document.getElementById('modalSurveyorName');
    const centerEl = document.getElementById('modalSurveyorCenter');
    const statsEl = document.getElementById('modalSurveyorStats');
    const funcListEl = document.getElementById('modalSurveyorFunctions');

    const questionsBySurveyor = allQuestions.filter(q => (q['Surveyor_Name'] || '') === name);
    const centers = [...new Set(questionsBySurveyor.map(q => q['MMD_Center']).filter(Boolean))];
    const functions = [...new Set(questionsBySurveyor.map(q => q['Function_Number']).filter(Boolean))];

    nameEl.textContent = name;
    centerEl.textContent = centers.length ? `MMD Center(s): ${centers.join(', ')}` : 'MMD Center: N/A';
    statsEl.textContent = `Total questions: ${questionsBySurveyor.length}`;

    funcListEl.innerHTML = '';
    functions.forEach(fn => {
        const li = document.createElement('li');
        li.textContent = fn;
        funcListEl.appendChild(li);
    });

    backdrop.style.display = 'flex';
}

function closeSurveyorModal() {
    document.getElementById('modalBackdrop').style.display = 'none';
}

function startDaily20() {
    dailyQuestions = shuffleArray([...allQuestions]).slice(0, 20);
    currentMode = 'daily';
    setMode('daily');
}

function startMockViva() {
    if (!dailyQuestions.length) {
        dailyQuestions = shuffleArray([...allQuestions]).slice(0, 20);
    }
    vivaIndex = 0;
    currentMode = 'viva';
    setMode('viva');
    showVivaQuestion();
}

function showVivaQuestion() {
    if (!dailyQuestions.length) return;
    const q = dailyQuestions[vivaIndex];
    const container = document.getElementById('questionsContainer');
    const stats = document.getElementById('stats');
    const loading = document.getElementById('loadingMsg');

    loading.style.display = 'none';
    stats.style.display = 'block';
    stats.textContent = `🎤 Mock Viva – Question ${vivaIndex + 1} of ${dailyQuestions.length}`;

    container.innerHTML = `
        <div class="card">
            <div class="meta-info">
                ${q['Surveyor_Name'] ? `<span>${q['Surveyor_Name']}</span>` : ''}
                ${q['Function_Number'] ? `<span>${q['Function_Number']}</span>` : ''}
                ${q['MMD_Center'] ? `<span>${q['MMD_Center']}</span>` : ''}
            </div>

            <div class="question-text">${q['Question']}</div>

            <button class="action-btn" onclick="toggleAnswer(this)">▼ Show Answer</button>

            <div class="answer-box">
                <div class="answer-title">✓ Answer:</div>
                <div class="answer-content">${formatAnswer(q['Expected_Answer'] || 'No answer provided')}</div>

                ${q['Fail_Trigger'] ? `<div class="fail-box"><strong>Fail Trigger:</strong> ${q['Fail_Trigger']}</div>` : ''}

                ${q['Reg_Source'] ? `<div class="reg-badge">Source: ${q['Reg_Source']}</div>` : ''}
            </div>

            <div class="tag-row" style="margin-top:15px;">
                <button class="action-btn" style="width:auto;" onclick="nextVivaQuestion()">Next Question ▶</button>
            </div>
        </div>
    `;
}

function nextVivaQuestion() {
    vivaIndex++;
    if (vivaIndex >= dailyQuestions.length) {
        vivaIndex = 0;
    }
    showVivaQuestion();
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
}

function toggleExamMode() {
    examMode = !examMode;
    const badge = document.getElementById('examModeBadge');
    if (examMode) {
        setTheme('light');
        badge.textContent = 'Mode: Exam Day (Minimal)';
    } else {
        setTheme('dark');
        badge.textContent = 'Mode: Normal';
    }
}

window.addEventListener('DOMContentLoaded', loadCSV);
</script>
