<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroMate Orals - Premium Chief Mate Prep Dashboard</title>

<style>
:root {
    --primary-dark: #0a192f;
    --primary-light: #f5f7fb;
    --accent: #64ffda;
    --text-dark: #8892b0;
    --text-light: #1f2933;
    --white: #e6f1ff;
    --card-bg-dark: rgba(17,34,64,0.85);
    --card-bg-light: rgba(255,255,255,0.85);
    --danger: #ff4d4d;
}

/* DARK MODE */
html[data-theme="dark"] body {
    background: radial-gradient(circle at top, #112240 0, #020c1b 40%, #000 100%);
    color: var(--text-dark);
}

/* LIGHT MODE FIX — TEXT NOW VISIBLE */
html[data-theme="light"] body {
    background: var(--primary-light);
    color: var(--text-light);
}

html[data-theme="light"] .question-text,
html[data-theme="light"] .answer-content,
html[data-theme="light"] .meta-info span {
    color: #1f2933 !important;
}

html[data-theme="light"] .card {
    background: rgba(255,255,255,0.85) !important;
}

html[data-theme="light"] .tag-btn {
    background: #ffffff !important;
    color: #1f2933 !important;
    border-color: #d1d5db !important;
}

html[data-theme="light"] .action-btn {
    background: #ffffff !important;
    color: #1f2933 !important;
    border-color: #d1d5db !important;
}

/* GENERAL UI */
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    padding: 0;
    padding-bottom: 80px;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #020c1b, #112240);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 2px solid rgba(255,255,255,0.05);
    position: relative;
}

header h1 {
    margin: 0;
    font-size: 28px;
    color: var(--white);
    font-weight: 700;
}

.subtitle
