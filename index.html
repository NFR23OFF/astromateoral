<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearYourMates - Maritime Orals Prep</title>

<style>
:root {
  --bg-dark: #0a192f;
  --bg-light: #f5f7fb;
  --accent: #64ffda;
  --text-dark: #8892b0;
  --text-light: #1f2933;
  --white: #e6f1ff;
}

html[data-theme="dark"] body {
  background: radial-gradient(circle at top, #112240 0, #020c1b 40%, #000 100%);
  color: var(--text-dark);
}

html[data-theme="light"] body {
  background: var(--bg-light);
  color: var(--text-light);
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  margin: 0;
  padding: 0;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #020c1b, #112240);
  padding: 24px 16px;
  text-align: center;
  color: var(--white);
  position: relative;
}

header h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
}

.subtitle {
  font-size: 13px;
  color: var(--accent);
  margin-top: 6px;
  font-weight: 600;
}

.subtitle-small {
  font-size: 11px;
  color: var(--white);
  opacity: 0.8;
  margin-top: 4px;
}

/* THEME TOGGLE */
.theme-toggle {
  position: absolute;
  top: 12px;
  right: 16px;
  display: flex;
  gap: 8px;
}

.theme-toggle button {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}

/* LAYOUT */
.main-layout {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media(min-width: 900px) {
  .main-layout {
    grid-template-columns: 300px 1fr;
  }
}
